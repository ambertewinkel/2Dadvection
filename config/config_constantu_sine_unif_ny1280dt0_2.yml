scheme: adhimex

nx: 128 
ny: 1280 
xmin: -500. # m
xmax: 500. # m
ymin: -500. # m
ymax: 500. # m
grid_x: uniform
grid_y: uniform
BC_x: periodic
BC_y: periodic

dt: 0.2 # s
nt: 500
starttime: 0.

velocity_setting: constant_u
constant_u: 10.
constant_v: 0.

initial_tracer: sine_swift

T: 100. # s
u0: 10. # m/s
nondivergent: True

solver: gmresm
theta_anisotropic: False

outputdir: constantu_sine_unif_ny1280dt0_2
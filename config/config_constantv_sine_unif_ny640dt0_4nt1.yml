scheme: adhimex

nx: 64 
ny: 640 
xmin: -500. # m
xmax: 500. # m
ymin: -500. # m
ymax: 500. # m
grid_x: uniform
grid_y: uniform
BC_x: periodic
BC_y: periodic

dt: 0.4 # s
nt: 1
starttime: 0.

velocity_setting: constant_v
constant_u: 0.
constant_v: 10.

initial_tracer: sine_swift

T: 100. # s
u0: 10. # m/s
nondivergent: True

solver: gmresm
theta_anisotropic: False

outputdir: constantv_sine_unif_ny640dt0_4nt1
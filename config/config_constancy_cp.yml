scheme: adhimex #adhimex #RK4CN_5Ex3Im #RK438PR2_5Ex3Im

nx: 153  
ny: 153
xmin: -500. # m
xmax: 500. # m
ymin: -500. # m
ymax: 500. # m
grid_x: lowerleftGP
grid_y: lowerleftGP
BC_x: periodic
BC_y: periodic

dt: 0.2 # s
nt: 500 
starttime: 0.

tolerance_solver_scheme: 1e-16 # relevant for RK438PR2 and RK4CN, not for adhimex as IG is exact match already

velocity_setting: swift_nondiv_streamfunction 

initial_tracer: constant
constant_tracer: 0.5

T: 100.
u0: 10.

nondivergent: True

solver: gmresm 

outputdir: swiftnondiv_constant
# based on Blossey Durran 2008 deformational rotation

scheme: adhimex #_adv

nx: 50
ny: 50
xmin: 0. # m
xmax: 1. # m
ymin: 0. # m
ymax: 1. # m
BC_x: periodic
BC_y: periodic
grid_x: uniform
grid_y: uniform #cosine4

dt: 0.2 #6. # s
nt: 500 #500 #100
starttime: 0.

velocity_setting: blossey_durran

initial_tracer: initial_blosseydurran
config.T: 100

FCT: True
#FCTreduced: True
nondivergent: True
#tracermin: 0.
#tracermax: 1.

solver: gmresm

filename: blosseydurran
verbose: True
animate: True
outputdir: testBD #blosseydurran_adhimexadv_nt500_ycos4
scheme: adhimex

nx: 64 
ny: 640 
xmin: -500. # m
xmax: 500. # m
ymin: -500. # m
ymax: 500. # m
grid_x: uniform
grid_y: uniform
BC_x: periodic
BC_y: periodic

dt: 0.4 # s
nt: 250
starttime: 0.

velocity_setting: swift_nondiv_streamfunction
constant_u: 10.
constant_v: 10.

initial_tracer: sine_swift

T: 100. # s
u0: 10. # m/s
nondivergent: True

solver: gmresm
theta_anisotropic: True

outputdir: swiftnondiv_sine_unif_anis_ny640dt0_4
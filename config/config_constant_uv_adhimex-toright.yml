constant_v: 1. #6.25 #6.25 #1. #0. #1. #0. #0. #1. #0.05 #0.2 #5.

initial_tracer: sine_xy #cosine_bell_y #sine_xy #cosine_bell #sine_xy

filename: toright
verbose: True
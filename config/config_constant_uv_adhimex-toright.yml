
scheme: adhimex #adimex_upwind

nx: 40 #10 #40
ny: 40
xmin: 0.
xmax: 1.
ymin: 0.
ymax: 1.
BC_x: periodic
BC_y: periodic
grid_setting: uniform

dt: 0.01

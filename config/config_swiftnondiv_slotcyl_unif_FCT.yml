scheme: RK438PR2_5Ex3Im #adhimex #RK4CN_5Ex3Im #RK438PR2_5Ex3Im

nx: 128 
ny: 128 
xmin: -500. # m
xmax: 500. # m
ymin: -500. # m
ymax: 500. # m
grid_x: uniform
grid_y: uniform
BC_x: periodic
BC_y: periodic

dt: 0.2 # s
nt: 500
starttime: 0.

velocity_setting: swift_nondiv_streamfunction

initial_tracer: slotted_cylinders

T: 100. # s
u0: 10. # m/s

FCT: False #True
nondivergent: True

solver: gmresm
theta_anisotropic: True
adjust_theta: True

outputdir: swiftnondiv_slotcyl_unif_FCT
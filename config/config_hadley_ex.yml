scheme: RK438PR2_5Ex3Im #adhimex #RK4CN_5Ex3Im #RK438PR2_5Ex3Im

nx: 180
ny: 180
xmin: -90. # deg
xmax: 90. # deg
ymin: 0. # m
ymax: 1.2e4 # m
grid_x: uniform 
grid_y: uniform 
BC_x: noflux
BC_y: noflux

dt: 432. # s
nt: 200
starttime: 0.

velocity_setting: hadley_HW

initial_tracer: hadley_HW
store_all_timesteps: True

solver: gmresm 

nondivergent: True
theta_anisotropic: True
adjust_theta: True

outputdir: hadley_ex